<style>
/* ======================= design tokens (PyCharm New UI, polished) ======================= */
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#ebecf0;--line:#e3e5ea;--hover:#eef0f4;--fg:#1f2328;--fg2:#6c707e;--fg3:#a8adbd;
  --accent:#3574f0;--accent-weak:#e9f0ff;--sel:#d4e2ff;--selfg:#1f2328;--gutter:#ffffff;--gutterfg:#aeb3c2;--activeline:#f5f8fe;
  --git-mod:#0a5fd0;--git-new:#007f23;--git-ign:#8d6a2b;--git-del:#8d8d8d;--arrow:#e5912a;--arrow-weak:rgba(229,145,42,.14);--ok:#369650;--ok-weak:rgba(54,150,80,.14);--warn:#c96d00;--bad:#e55765;
  --font:"Inter",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --kw:#0033b3;--str:#067d17;--num:#1750eb;--cmt:#8c8c8c;--fn:#00627a;--def:#1f2328;--dec:#9e880d;--builtin:#871094;--tag:#0033b3;--attr:#174ad4;--prop:#871094;
  --diff-add:#e8f5ee;--diff-del:#fbe9eb;
  --r:8px;--r-sm:6px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shadow-lg:0 12px 40px rgba(16,24,40,.22);
  --sidew:290px;
}
:root[data-theme="dark"]{
  --bg:#1e1f22;--bg2:#2b2d30;--bg3:#393b40;--line:#36383d;--hover:#2e3036;--fg:#bcbec4;--fg2:#8c8f99;--fg3:#6f737a;
  --accent:#4c8dff;--accent-weak:rgba(76,141,255,.14);--sel:#2e436e;--selfg:#dfe1e5;--gutter:#1e1f22;--gutterfg:#4b5059;--activeline:#26282e;
  --git-mod:#6c9bff;--git-new:#73bd79;--git-ign:#d3a16b;--git-del:#7a7e85;--arrow:#f0a45d;--arrow-weak:rgba(240,164,93,.16);--ok:#5fad65;--ok-weak:rgba(95,173,101,.16);--warn:#e8b85f;--bad:#f06a73;
  --kw:#cf8e6d;--str:#6aab73;--num:#2aacb8;--cmt:#7a7e85;--fn:#56a8f5;--def:#bcbec4;--dec:#b3ae60;--builtin:#8888c6;--tag:#d5b778;--attr:#bcbec4;--prop:#c77dbb;
  --diff-add:#1f3a2a;--diff-del:#4a2224;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 9px;cursor:pointer;line-height:1.3;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:#fff}button.pri:hover{filter:brightness(1.08)}
button.sm{padding:3px 8px;font-size:12px}
button.icon{padding:5px;color:var(--fg2);border-radius:var(--r-sm)}
button.icon:hover{color:var(--fg);background:var(--hover)}
button.icon.on{color:var(--accent);background:var(--accent-weak)}
button:disabled{opacity:.45;cursor:default}
.lucide,svg.ic{width:16px;height:16px;flex:none}
button .lucide{width:15px;height:15px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea{font-family:var(--font);resize:vertical;width:100%}
.muted{color:var(--fg2)}
kbd{font-family:var(--mono);background:var(--bg3);border-radius:4px;padding:0 5px;font-size:11px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* ======================= layout ======================= */
#app{display:grid;grid-template-columns:var(--sidew) 1fr 0px;grid-template-rows:100%;height:100%;overflow:hidden;transition:grid-template-columns .15s ease}
#app.drawer{grid-template-columns:var(--sidew) 1fr 360px}
#app.noside{grid-template-columns:0 1fr 0}
#app.noside.drawer{grid-template-columns:0 1fr 360px}
aside{background:var(--bg2);overflow:auto;min-width:0;position:relative}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column}
#side .side-body{flex:1;overflow:auto;padding-bottom:12px}
#sideGrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:4}
#drawer{border-left:1px solid var(--line);display:flex;flex-direction:column}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.hdr{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg2);min-height:44px;border-bottom:1px solid var(--line)}
.hdr .title{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}

/* ---- sidebar: header + open project ---- */
.side-top{position:sticky;top:0;z-index:3;background:var(--bg2)}
.openproj{padding:8px 10px 6px}
.openproj button{width:100%;justify-content:center;border:1px dashed var(--line);color:var(--fg2);padding:6px}
.openproj button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
/* ---- project blocks ---- */
.proj{padding:2px 0 4px}
.proot{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;cursor:pointer;user-select:none;white-space:nowrap;border-radius:var(--r-sm);margin:0 6px}
.proot:hover{background:var(--hover)}
.proot .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2);flex:none}
.proot .tw .lucide{transition:transform .12s}
.proot.open .tw .lucide{transform:rotate(90deg)}
.proot .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.proot .branch{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);background:var(--accent-weak);border:0;border-radius:999px;padding:1px 8px 1px 6px;max-width:150px;cursor:pointer;flex:none}
.proot .branch .lucide{width:12px;height:12px}
.proot .branch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proot .branch .ab{color:var(--fg2);font-size:10px}
.proot .branch:hover{background:var(--sel)}
.proot .sp{flex:1}
.proot .act{display:inline-flex;gap:0;opacity:.0;transition:opacity .12s}
.proot:hover .act,.proot:focus-within .act{opacity:1}
.proot .act button{padding:3px}
.proot .act .lucide{width:14px;height:14px}
.node{display:flex;align-items:center;gap:6px;height:26px;padding-right:8px;cursor:pointer;white-space:nowrap;user-select:none;color:var(--fg);margin:0 6px;border-radius:var(--r-sm);font-size:12.5px}
.node:hover{background:var(--hover)}
.node.active{background:var(--sel);color:var(--selfg)}
.node .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2);flex:none}
.node .tw .lucide{width:14px;height:14px;transition:transform .12s}
.node.open .tw .lucide{transform:rotate(90deg)}
.node .nm{overflow:hidden;text-overflow:ellipsis}
.node .dir{color:var(--fg2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
.node .st{margin-left:auto;font-size:11px;font-weight:700;color:var(--fg2)}
.g-M .nm{color:var(--git-mod)}.g-A .nm,.g-\?\? .nm{color:var(--git-new)}.g-D .nm{color:var(--git-del);text-decoration:line-through}.g-ign .nm{color:var(--git-ign)}
.sect{padding:6px 14px 2px;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--fg2);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sect .n{background:var(--bg3);border-radius:999px;padding:0 7px;font-size:10px;font-weight:600}
.sect-btn{cursor:pointer;user-select:none;border-radius:var(--r-sm);margin:0 6px;padding-left:8px}
.sect-btn:hover{background:var(--hover)}
.sect-btn .lucide{width:13px;height:13px}

/* ---- tabs + toolbar ---- */
#topbar{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--line);min-height:44px;gap:4px;padding-left:6px}
#tabs{display:flex;flex:1;overflow-x:auto;min-height:44px;scrollbar-width:none;align-self:stretch}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;cursor:pointer;white-space:nowrap;color:var(--fg2);border-bottom:2px solid transparent;font-size:12.5px}
.tab:hover{background:var(--hover)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab .x{opacity:0;padding:2px;display:inline-flex;border-radius:4px}.tab:hover .x,.tab.active .x{opacity:.6}.tab .x:hover{opacity:1;background:var(--bg3)}
.tab .x .lucide{width:13px;height:13px}
.tab.dirty .nm:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
#bar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--line);min-height:38px;flex-wrap:wrap}
#bar .path{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2);min-width:120px}
#bar .path span{cursor:pointer}#bar .path span:hover{color:var(--fg)}
#bar .path .cur{color:var(--fg)}
button.tb{padding:4px 9px;font-size:12px;color:var(--fg2);border-radius:var(--r-sm)}
button.tb:hover{color:var(--fg);background:var(--hover)}
button.tb.accent{color:var(--arrow)}button.tb.accent:hover{background:var(--arrow-weak)}
button.tb.on{color:var(--accent);background:var(--accent-weak)}
button.tb .cnt{font-size:10px;font-weight:700;background:var(--arrow);color:#fff;border-radius:999px;padding:0 6px}
button.tb .cnt:empty{display:none}
.tb-sep{width:1px;height:16px;background:var(--line);margin:0 4px}
#banner{display:none;padding:6px 12px;background:#fff3cd;color:#664d03;border-bottom:1px solid #ffe69c;font-size:12px}
:root[data-theme="dark"] #banner{background:#4a3b00;color:#ffe69c;border-color:#6b5500}
#banner.show{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#editor{flex:1;min-height:0;position:relative}
#mdview{flex:1;overflow:auto;padding:20px 36px;max-width:920px;display:none;line-height:1.6;font-size:14px}
#mdview pre{background:var(--bg2);padding:10px 12px;border-radius:var(--r);overflow:auto}
#mdview code{font-family:var(--mono);font-size:12.5px}
#mdview img{max-width:100%}
#mdview table{border-collapse:collapse}#mdview td,#mdview th{border:1px solid var(--line);padding:4px 10px}
#mdview a{color:var(--accent)}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-direction:column;gap:10px;padding:24px;text-align:center}
#empty .big{font-size:15px;color:var(--fg);font-weight:600}
#empty .lucide{width:40px;height:40px;color:var(--fg3)}
#status{display:flex;align-items:center;gap:14px;padding:0 12px;min-height:26px;background:var(--bg2);border-top:1px solid var(--line);font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden}
#status .it{display:inline-flex;align-items:center;gap:5px}
#status .lucide{width:13px;height:13px}
#status .sp{flex:1}

/* ---- CodeMirror theme ---- */
.CodeMirror{height:100%;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--bg);color:var(--fg)}
.cm-s-pycharm .CodeMirror-gutters{background:var(--gutter);border-right:0;cursor:pointer}
.cm-s-pycharm .CodeMirror-linenumber{color:var(--gutterfg);padding:0 8px 0 12px}
.cm-s-pycharm .CodeMirror-activeline-background{background:var(--activeline)}
.cm-s-pycharm .CodeMirror-activeline .CodeMirror-linenumber{color:var(--fg)}
.cm-s-pycharm .CodeMirror-cursor{border-left:2px solid var(--fg)}
.cm-s-pycharm .CodeMirror-selected,.cm-s-pycharm .CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.cm-s-pycharm .CodeMirror-matchingbracket{background:rgba(53,116,240,.25);color:inherit!important;font-weight:600}
.cm-s-pycharm .cm-keyword{color:var(--kw)}.cm-s-pycharm .cm-string,.cm-s-pycharm .cm-string-2{color:var(--str)}.cm-s-pycharm .cm-number{color:var(--num)}
.cm-s-pycharm .cm-comment{color:var(--cmt);font-style:italic}.cm-s-pycharm .cm-def{color:var(--fn)}.cm-s-pycharm .cm-variable{color:var(--def)}
.cm-s-pycharm .cm-variable-2,.cm-s-pycharm .cm-variable-3,.cm-s-pycharm .cm-type{color:var(--fg)}.cm-s-pycharm .cm-builtin{color:var(--builtin)}
.cm-s-pycharm .cm-meta{color:var(--dec)}.cm-s-pycharm .cm-operator{color:var(--fg)}.cm-s-pycharm .cm-property{color:var(--prop)}.cm-s-pycharm .cm-atom{color:var(--kw)}
.cm-s-pycharm .cm-tag{color:var(--tag)}.cm-s-pycharm .cm-attribute{color:var(--attr)}.cm-s-pycharm .cm-qualifier{color:var(--dec)}
.cm-s-pycharm .cm-header{color:var(--fn);font-weight:600}.cm-s-pycharm .cm-link{color:var(--accent);text-decoration:underline}.cm-s-pycharm .cm-url{color:var(--str)}
.cm-s-pycharm .cm-quote{color:var(--str)}.cm-s-pycharm .cm-strong{font-weight:600}.cm-s-pycharm .cm-em{font-style:italic}
.cm-s-pycharm .cm-positive{color:var(--git-new)}.cm-s-pycharm .cm-negative{color:var(--bad)}
.CodeMirror-line.diff-add{background:var(--diff-add)}.CodeMirror-line.diff-del{background:var(--diff-del)}
.cm-comments{width:20px}
.cm-cmark{color:var(--arrow);font-size:13px;line-height:1;padding-left:3px}
.cm-cmark.resolved{opacity:.35}
.cm-addc{display:inline-flex;color:var(--fg3);cursor:pointer;padding-left:2px;vertical-align:middle}
.cm-addc:hover{color:var(--arrow)}
.cm-addc .lucide{width:14px;height:14px}
.cm-cline{background:var(--arrow-weak)}
.cm-cline-sel{background:var(--accent-weak)}

/* ---- comment card ---- */
.cwidget{margin:6px 0 8px 52px;background:var(--bg2);padding:10px 14px 12px;font-family:var(--font);font-size:12.5px;max-width:760px;border-radius:var(--r);border:1px solid var(--line);border-left:3px solid var(--arrow);box-shadow:var(--shadow)}
.cwidget.resolved{border-left-color:var(--ok);opacity:.8}
.cwidget .meta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--fg2);flex-wrap:wrap}
.cwidget .meta .sp{flex:1}
.cwidget .who{font-weight:600;color:var(--fg)}
.av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;color:#fff}
.av.you{background:var(--arrow)}.av.ai{background:var(--accent)}
.pill{font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.pill.open{background:var(--arrow-weak);color:var(--warn)}.pill.resolved{background:var(--ok-weak);color:var(--ok)}
.cwidget .act{font-size:11.5px;color:var(--fg2);padding:3px 8px}
.cwidget .act:hover{color:var(--fg);background:var(--hover)}
.cwidget .act .lucide{width:13px;height:13px}
.cwidget .act.ico{padding:3px 5px}
.cwidget .txt{white-space:pre-wrap;margin:8px 0 2px 28px;line-height:1.5}
.cwidget .reply{display:flex;gap:10px;margin:10px 0 0 28px;padding:10px 12px;background:var(--bg);border-radius:var(--r-sm);border:1px solid var(--line)}
.cwidget .reply .rbody{white-space:pre-wrap;line-height:1.5;flex:1}
.cwidget .reply .rwho{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.cform{margin:6px 0 8px 52px;max-width:760px;display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow)}
.cform .row{display:flex;gap:8px;align-items:center}
.cform .hint{font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:6px}

/* ---- drawer ---- */
#clist{flex:1;overflow:auto;padding:8px}
.citem{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;cursor:pointer;background:var(--bg);box-shadow:var(--shadow)}
.citem:hover{border-color:var(--accent)}
.citem.resolved{opacity:.6}
.citem .loc{font-family:var(--mono);font-size:11px;color:var(--accent);display:flex;gap:6px;align-items:center}
.citem .txt{white-space:pre-wrap;margin:4px 0}
.citem .reply{font-size:12px;color:var(--fg2);white-space:pre-wrap;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.citem .reply:before{content:"Claude: ";color:var(--accent);font-weight:600}
.citem .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.citem input[type=checkbox]{margin:0}
.filters{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;font-size:12px}

/* ---- modals ---- */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{width:680px;max-width:100%;max-height:85vh;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.modal .hdr{border-bottom:1px solid var(--line)}
#palette{align-items:flex-start;padding-top:10vh}
#palette .box{width:640px}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;font-size:14px;background:var(--bg);box-shadow:none}
#plist{max-height:50vh;overflow:auto;padding:4px}
#plist .it{padding:6px 12px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;border-radius:var(--r-sm)}
#plist .it.sel{background:var(--sel);color:var(--selfg)}
#plist .it .pj{color:var(--fg2);margin-left:auto;font-size:12px}
#plist b{color:var(--accent);font-weight:600}
.pk-quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.pk-quick button{font-size:12px;border:1px solid var(--line)}
.pk-recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
.pk-recent .rc{color:var(--accent);border:1px solid var(--line)}
.pk-path{display:flex;gap:6px;padding:10px 12px;align-items:center}
.pk-path input{flex:1;font-family:var(--mono);font-size:12px}
#pkList{flex:1;overflow:auto;padding:4px 8px;min-height:200px}
.pk-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer}
.pk-row:hover{background:var(--hover)}
.pk-row .nm{flex:1}
.pk-row .tagp{font-size:11px;color:var(--fg2);background:var(--bg3);border-radius:999px;padding:0 7px}
.pk-row .tagp.git{color:var(--git-new)}
.pk-foot{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.ask .box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:320px;max-width:100%;box-shadow:var(--shadow-lg)}
.ask .txt{margin-bottom:14px}
.ask .row{display:flex;gap:8px;justify-content:flex-end}
#bmenu{position:fixed;z-index:80;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);min-width:260px;max-height:320px;overflow:auto;padding:6px;display:none}
#bmenu.show{display:block}
#bmenu .bh{padding:4px 8px;font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
#bmenu .bi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px}
#bmenu .bi:hover{background:var(--hover)}
#bmenu .bi.cur{color:var(--accent);font-weight:600}
#bmenu .bi .when{margin-left:auto;color:var(--fg3);font-size:11px}
#bmenu .warn{padding:6px 10px;font-size:11px;color:var(--warn)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;font-size:12px;box-shadow:var(--shadow-lg);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

/* ======================= responsive ======================= */
@media (max-width: 900px){
  #app,#app.drawer,#app.noside,#app.noside.drawer{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:40;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow-lg)}
  #app:not(.noside) #side{transform:translateX(0)}
  #app:not(.noside) #backdrop{display:block}
  #drawer{position:fixed;right:0;top:0;bottom:0;width:min(92vw,380px);z-index:40;transform:translateX(100%);transition:transform .18s ease;box-shadow:var(--shadow-lg)}
  #app.drawer #drawer{transform:translateX(0)}
  #app.drawer #backdrop{display:block}
  button.tb .lbl{display:none}
  #sideGrip{display:none}
  .cwidget,.cform{margin-left:8px}
  #mdview{padding:16px}
}

async function closeTab(t){

  if (S.active===t){ S.active=null; if(S.tabs.length) activate(S.tabs[S.tabs.length-1]); else { S.cm.swapDoc(new CodeMirror.Doc('')); $('#empty').style.display='flex'; renderPath(); renderTabs(); markActiveInTree(); renderDrawer(); setSaveState(''); renderStatus(); } }

async function saveActive(tab){

async function forceSave(){ const t=S.active; const r = await api.send('PUT', `/api/file?p=${t.pid}&path=${encodeURIComponent(t.path)}`, {content:t.doc.getValue()}); t.mtime=r.mtime; t.dirty=false; renderTabs(); hideBanner(); setSaveState('сохранено'); }
async function reloadActive(force){

// ------------------------------------------------------------ markdown / diff
function toggleMd(){ const t=S.active; if(!t) return; t.mode = t.mode==='md' ? 'code' : 'md'; activate(t); }
function showMd(t){ $('#editor').style.display='none'; const v=$('#mdview'); v.style.display='block'; v.innerHTML = marked.parse(t.doc.getValue()); }
async function toggleDiff(){ const t=S.active; if(!t) return; t.mode = t.mode==='diff' ? 'code' : 'diff'; activate(t); }
async function showDiff(t){
  $('#mdview').style.display='none'; $('#editor').style.display='block';
  const text = await api.get(`/api/diff?p=${t.pid}&path=${encodeURIComponent(t.path)}`);
  t.diffText = text || '(нет изменений относительно HEAD)';
  t.diffMap = []; let nl=0;
  for (const ln of t.diffText.split('\n')){
    const m = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
    if (m){ nl=+m[1]; t.diffMap.push(null); continue; }
    if (ln.startsWith('+') && !ln.startsWith('+++')){ t.diffMap.push(nl); nl++; }
    else if (ln.startsWith('-') && !ln.startsWith('---')){ t.diffMap.push(nl); }
    else if (ln.startsWith(' ')){ t.diffMap.push(nl); nl++; }
    else t.diffMap.push(null);
  }
  t.diffDoc = new CodeMirror.Doc(t.diffText, 'diff');
  S.cm.swapDoc(t.diffDoc); S.cm.setOption('readOnly', true);
  t.diffText.split('\n').forEach((ln,i)=>{ if(ln.startsWith('+')&&!ln.startsWith('+++')) S.cm.addLineClass(i,'text','diff-add'); else if(ln.startsWith('-')&&!ln.startsWith('---')) S.cm.addLineClass(i,'text','diff-del'); });
}

// ------------------------------------------------------------ comments
function commentsForActive(){ const t=S.active; if(!t) return []; return proj(t.pid).comments.filter(c=>c.path===t.path); }
function hasMarker(line){ return commentLines().has(line); }
function commentLines(){ const set=new Set(); const t=S.active; if(!t) return set; for (const c of commentsForActive()){ let line=c.line-1; if(t.mode!=='diff' && !lineMatches(c,t.doc)) line=relocate(c,t.doc); if(line>=0) set.add(line); } return set; }
function commentHere(){ const cm=S.cm; if(!S.active||S.active.mode==='md') return; const sel=cm.listSelections()[0]; let a=sel.from().line, b=sel.to().line; if(sel.to().ch===0 && b>a) b--; openForm(a,b); }
function fmtWhen(ts){ if(!ts) return ''; const d=new Date(ts*1000), now=new Date(); const sameDay = d.toDateString()===now.toDateString(); return sameDay ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([], {day:'numeric',month:'short'})+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function decorate(){
  const cm=S.cm, t=S.active;
  S.widgets.forEach(w=>w.clear()); S.widgets=[];
  cm.clearGutter('cm-comments'); S.hoverLine=null;
  cm.eachLine(l => { cm.removeLineClass(l,'background','cm-cline'); cm.removeLineClass(l,'background','cm-cline-sel'); });
  if(!t || t.mode==='md') return;
  for (const c of commentsForActive()){
    let line = c.line-1;
    if (t.mode==='diff'){
      const lines=t.diffText.split('\n');
      const idx = t.diffMap.findIndex((n,i)=> n===c.line && (lines[i]||'').slice(1).trim()===(c.snippet||'').split('\n')[0].trim());
      line = idx>=0 ? idx : t.diffMap.findIndex(n=>n===c.line); if(line<0) continue;
    } else if (!lineMatches(c, t.doc)) { line = relocate(c, t.doc); if(line<0) continue; }
    const m=document.createElement('span'); m.className='cm-cmark'+(c.status==='resolved'?' resolved':''); m.textContent='➤'; m.title=c.text;
    cm.setGutterMarker(line,'cm-comments',m);
    if (c.status==='open') for(let i=line;i<=line+(c.endLine-c.line);i++) cm.addLineClass(i,'background','cm-cline');
    const w=document.createElement('div'); w.className='cwidget'+(c.status==='resolved'?' resolved':'');
    w.innerHTML = `<div class="meta"><span class="av you">Я</span><span class="who">Комментарий</span><span class="pill ${c.status}">${c.status==='open'?'открыт':'решён'}</span><span>${fmtWhen(c.createdAt)}</span><span class="sp"></span>
      ${c.status==='open'?`<button class="act" title="Отметить решённым" onclick="setStatus('${c.id}','resolved')">${lu('check')}<span>решено</span></button>`:`<button class="act" title="Открыть снова" onclick="setStatus('${c.id}','open')">${lu('undo-2')}<span>открыть снова</span></button>`}
      <button class="act ico" title="Скопировать путь:строка" onclick="copyText('${esc(proj(t.pid).path)}/${esc(c.path)}:${c.line}')">${lu('copy')}</button><button class="act ico" title="Удалить" onclick="delComment('${c.id}')">${lu('trash-2')}</button></div>
      <div class="txt">${esc(c.text)}</div>${c.reply?`<div class="reply"><span class="av ai">C</span><div class="rbody"><div class="rwho">Claude${c.resolvedAt?` · ${fmtWhen(c.resolvedAt)}`:''}</div>${esc(c.reply)}</div></div>`:''}`;
    icons(w);
    S.widgets.push(cm.addLineWidget(line+(c.endLine-c.line), w, {coverGutter:false, noHScroll:true}));
  }
}
function lineMatches(c, doc){ const l = doc.getLine(c.line-1); return l!=null && l.trim()===(c.snippet||'').split('\n')[0].trim(); }
function relocate(c, doc){
  const first=(c.snippet||'').split('\n')[0].trim(); if(!first) return c.line-1 < doc.lineCount() ? c.line-1 : -1;
  let best=-1, bestD=1e9;
  doc.eachLine((lh)=>{ const i=doc.getLineNumber(lh); if(lh.text.trim()===first){ const d=Math.abs(i-(c.line-1)); if(d<bestD){bestD=d;best=i;} } });
  return best>=0 ? best : (c.line-1 < doc.lineCount() ? c.line-1 : -1);
}
function openForm(from,to){
  closeForm(); const t=S.active; if(!t) return;
  const cm=S.cm;
  for(let i=from;i<=to;i++) cm.addLineClass(i,'background','cm-cline-sel');
  const d=document.createElement('div'); d.className='cform';
  d.innerHTML=`<div class="hint">${lu('message-square-plus')} Комментарий для Claude к строк${from===to?'е':'ам'} ${from+1}${to>from?'–'+(to+1):''} · Enter — сохранить, Shift+Enter — перенос, Esc — отмена</div>
    <textarea rows="2" placeholder="Что поправить или объяснить…"></textarea><div class="row"><button class="pri sm" id="cfsave">${lu('send')}Сохранить</button><button class="sm" id="cfcancel">Отмена</button></div>`;
  icons(d);
  S.form = { widget: cm.addLineWidget(to, d, {noHScroll:true}), from, to };
  const ta=d.querySelector('textarea'); setTimeout(()=>ta.focus(),0);
  ta.onkeydown = e => { if((e.key==='Enter'||e.keyCode===13) && !e.shiftKey){ e.preventDefault(); submitForm(ta.value); } if(e.key==='Escape') closeForm(); };
  d.querySelector('#cfsave').onclick=()=>submitForm(ta.value); d.querySelector('#cfcancel').onclick=closeForm;
}
function closeForm(){ if(!S.form) return; S.form.widget.clear(); S.cm.eachLine(l=>S.cm.removeLineClass(l,'background','cm-cline-sel')); S.form=null; }
async function submitForm(text){
  text=text.trim(); if(!text) return; const t=S.active, f=S.form; if(!f) return;
  let line=f.from+1, endLine=f.to+1, snippet=S.cm.getRange({line:f.from,ch:0},{line:f.to,ch:1e9}), source='file';
  if (t.mode==='diff'){ const nl=t.diffMap[f.from], ne=t.diffMap[f.to]; if(nl==null){ toast('Эту строку диффа нельзя комментировать'); return; } line=nl; endLine=ne??nl; snippet=snippet.split('\n').map(s=>s.slice(1)).join('\n'); source='diff'; }
  await api.send('POST',`/api/comments?p=${t.pid}`,{path:t.path,line,endLine,snippet,text,source});
  closeForm(); await refreshProject(t.pid); decorate(); renderDrawer(); renderProjects(); toast('Комментарий сохранён, Claude увидит его со следующим сообщением');
}
async function setStatus(id,status){ const p = S.projects.find(p=>p.comments.some(c=>c.id===id)); await api.send('PATCH',`/api/comments/${id}?p=${p.id}`,{status}); await refreshProject(p.id); decorate(); renderDrawer(); renderProjects(); }
async function delComment(id){ const p = S.projects.find(p=>p.comments.some(c=>c.id===id)); if(!(await ask('Удалить комментарий?','Удалить'))) return; await api.send('DELETE',`/api/comments/${id}?p=${p.id}`); await refreshProject(p.id); decorate(); renderDrawer(); renderProjects(); }

// ------------------------------------------------------------ palette (Cmd+P)
let pal = {items:[], sel:0};
async function openPalette(){
  for (const p of S.projects) if(!S.files[p.id]) S.files[p.id] = await api.get('/api/files?p='+p.id);
  $('#palette').classList.add('show'); const i=$('#pinput'); i.value=''; i.focus(); filterPalette('');
}
function closePalette(){ $('#palette').classList.remove('show'); if(S.active&&S.active.mode==='code') S.cm.focus(); }
function fuzzy(q, s){
  q=q.toLowerCase(); const t=s.toLowerCase(); let qi=0, score=0, last=-1, hl=[];
  for (let i=0;i<t.length && qi<q.length;i++){ if(t[i]===q[qi]){ score += (last>=0 ? i-last-1 : i)*(t[i-1]==='/'?0.2:1); last=i; hl.push(i); qi++; } }
  if (qi<q.length) return null; return {score: score + (t.length-q.length)*0.01 + (t.lastIndexOf('/')>last?30:0), hl};
}
function filterPalette(q){
  const lineM=/^(.*?):(\d+)$/.exec(q); let line=null; if(lineM){ q=lineM[1]; line=+lineM[2]; }
  let items=[];
  for (const p of S.projects) for (const f of (S.files[p.id]||[])){ const r = q ? fuzzy(q,f) : {score:0,hl:[]}; if(r) items.push({pid:p.id,name:p.name,path:f,line,...r}); }
  items.sort((a,b)=>a.score-b.score); pal.items=items.slice(0,60); pal.sel=0; renderPalette();
}
function renderPalette(){
  const h=$('#plist'); h.innerHTML='';
  pal.items.forEach((it,i)=>{ const d=document.createElement('div'); d.className='it'+(i===pal.sel?' sel':'');
    const hs=new Set(it.hl); d.innerHTML=`${ic(iconFor(it.path.split('/').pop(),'file'))}<span>${[...it.path].map((ch,j)=>hs.has(j)?'<b>'+esc(ch)+'</b>':esc(ch)).join('')}</span><span class="pj">${esc(it.name)}</span>`;
    d.onclick=()=>pickPalette(i); h.appendChild(d); });
}
function pickPalette(i){ const it=pal.items[i]; if(!it) return; closePalette(); openFile(it.pid,it.path,{line:it.line,mode:'code'}); if (isNarrow()) setSide(false); }
$('#pinput').addEventListener('input', e=>filterPalette(e.target.value));
$('#pinput').addEventListener('keydown', e=>{ if(e.key==='ArrowDown'){pal.sel=Math.min(pal.sel+1,pal.items.length-1);renderPalette();e.preventDefault();} if(e.key==='ArrowUp'){pal.sel=Math.max(pal.sel-1,0);renderPalette();e.preventDefault();} if(e.key==='Enter') pickPalette(pal.sel); if(e.key==='Escape') closePalette(); const s=$('#plist .sel'); if(s) s.scrollIntoView({block:'nearest'}); });
document.addEventListener('keydown', e=>{
  const mod = e.metaKey||e.ctrlKey;
  if(mod&&e.key==='p'){ e.preventDefault(); openPalette(); }
  if(mod&&e.key==='s'){ e.preventDefault(); saveActive(); }
  if(mod&&e.key==='b'){ e.preventDefault(); toggleSide(); }
  if(mod&&e.key==='o'){ e.preventDefault(); openPicker(); }
  if(e.key==='Escape'){ if($('#picker').classList.contains('show')) closePicker(); else if (isNarrow()) closeOverlays(); }
});

// ------------------------------------------------------------ polling: fresh files, comments, git status
async function poll(){
  await consumeInbox();
  for (const p of S.projects){
    const t = S.active && S.active.pid===p.id ? S.active : null;
    const r = await api.get(`/api/poll?p=${p.id}${t?'&path='+encodeURIComponent(t.path):''}`).catch(()=>null); if(!r) continue;
    let changed=false;
    if (p._cm!==undefined && r.commentsMtime!==p._cm) changed=true;
    if (p._sh!==undefined && r.statusHash!==p._sh) changed=true;
    p._cm=r.commentsMtime; p._sh=r.statusHash;
    if (changed){ await refreshProject(p.id); renderProjects(); if(t){ decorate(); } renderDrawer(); S.files[p.id]=null; }
    if (t && r.fileMtime!=null && t.mtime!=null && Math.abs(r.fileMtime-t.mtime)>1e-6){
      if (t.dirty) { t.mtime=r.fileMtime; showBanner('Файл изменился на диске (вероятно, Claude), а у тебя есть несохранённые правки.'); }
      else { await reloadActive(false); if(t.mode==='diff') await showDiff(t).then(decorate); toast('Файл обновлён с диска'); }
    }
  }
}
setInterval(poll, 1500);

initEditor();
icons();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('resize', () => { if (isNarrow() && S.sideOpen) { S.sideOpen=false; $('#app').classList.add('noside'); } $('#btnSide').classList.toggle('on', S.sideOpen && !isNarrow()); });
loadProjects().then(async ()=>{
  await restoreState();
  const u=new URL(location.href); const open=u.searchParams.get('open');
  if(open){ const m=/^([^:]+):(.+?)(?::(\d+))?$/.exec(open); if(m) await openFile(m[1],m[2],{line:m[3]?+m[3]:null}); }
  // ?demo=picker|drawer opens that part of the UI after load (screenshots, docs)
  const demo=u.searchParams.get('demo'); if(demo==='picker') openPicker(); if(demo==='drawer' && !S.drawerOpen) toggleDrawer();
  renderStatus();
});
</script>
</body>
</html>
